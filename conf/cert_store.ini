[SYSTEM]
#1:print on screen, 0:don't
DEBUG_SWITCH = 1
#10:DEBUG, 20:INFO, 30:FATAL
RUN_LOG_LEVEL = 10
RUN_LOG_PATH = ./logs
[CONFIG]
#运行线程数
thread-nu = 4
#本地默认根证书签发有效期，默认为30天
expire_after = 30
#本地默认根证书路径
def-ca-path = ../ca
[NTC_MAAT]
#配置加载模式，1为使用本地json，0为使用配置分发网络下发的文件
maat_json_switch=2
#当加载模式为网络下发时，设置扫描配置修改间隔(s)
effective_interval=1
#指定配置库表文件位置
table_info=../conf/table_info.conf
#增量配置文件路径
inc_cfg_dir=../rule/inc/index
#全量配置文件路径
full_cfg_dir=../rule/full/index
#json模式时json文件路径
pxy_obj_keyring=../conf/pxy_obj_keyring.json
[LIBEVENT]
#本地监控端口号，默认为9991
port = 9991
[CERTSTORE_REDIS]
ip = 127.0.0.1
port = 6379
[MAAT_REDIS]
#指定Redsi服务器IP地址和端口号
ip = 192.168.11.243
port = 6379
dbindex = 4

